
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App 2 - Calculadora de média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="cartao">
        <h1>📊 Calculadora de média</h1>
        <p class="subtitulo">Digite as 3 notas (de 0 a 10) e descubra a situação do aluno.</p>

        <label for="nome">Nome do aluno</label>
        <input type="text" id="nome" placeholder="Ex.: Ash Ketchum">

        <div class="notas">
            <div>
                <label for="nota1">Nota 1</label>
                <input type="number" id="nota1" min="0" max="10" step="0.1">
            </div>
            <div>
                <label for="nota2">Nota 2</label>
                <input type="number" id="nota2" min="0" max="10" step="0.1">
            </div>
            <div>
                <label for="nota3">Nota 3</label>
                <input type="number" id="nota3" min="0" max="10" step="0.1">
            </div>
        </div>

        <button id="botao-calcular">Calcular média</button>

        <!-- O resultado aparece aqui. A classe muda de cor pelo JavaScript -->
        <div id="resultado" class="resultado escondido"></div>

        <p class="regras">Aprovado: média 7 ou mais · Recuperação: de 5 a 6,9 · Reprovado: abaixo de 5</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
